version: "2"

linters:
  enable:
    - revive

  settings:
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1020
        - -ST1021
        - -ST1022
    revive:
      rules:
        - name: use-any
          severity: error
    errcheck:
      check-type-assertions: false
      check-blank: false
      exclude-functions:
        - (io.Closer).Close
        - (net.Conn).Close
        - syscall.Kill
        - fmt.Fprintln
        - fmt.Fprintf

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
      - linters:
          - errcheck
        text: "Error return value of `.+\\.(Close|Stop)` is not checked"
